name: Boston PBRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      device_tree:
        description: Device tree repository URL
        required: true
        default: https://github.com/PizzaG/android_device_motorola_boston.git
        type: string
      device_branch:
        description: Device tree branch
        required: true
        default: TWRP
        type: string
      device_path:
        description: Device tree path inside the recovery source
        required: true
        default: device/motorola/boston
        type: string
      recovery_type:
        description: Recovery type
        required: true
        default: pbrp
        type: choice
        options:
          - pbrp
      build_target:
        description: Build target
        required: true
        default: recoveryimage
        type: choice
        options:
          - recoveryimage
          - vendorbootimage
          - bootimage
      auto_release:
        description: Create a GitHub Release if a valid image is built
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: boston-pbrp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PBRP for Boston
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: UTC
      DEVICE: boston
      DEVICE_PATH: device/motorola/boston
      PB_BUILD_DEVICE: boston
      PB_BUILD_TYPE: UNOFFICIAL
      BUILD_TARGET: ${{ inputs.build_target }}

    steps:
      - name: Show configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovery: PBRP"
          echo "Device: ${DEVICE}"
          echo "Tree URL: ${{ inputs.device_tree }}"
          echo "Tree branch: ${{ inputs.device_branch }}"
          echo "Tree path: ${DEVICE_PATH}"
          echo "Build target: ${BUILD_TARGET}"
          echo "PBRP manifest branch: pb-12.1 (fixed by this workflow)"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop lzip make python-is-python3 python3 \
            rsync schedtool squashfs-tools unzip xz-utils zip zlib1g-dev
          git lfs install
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod +x "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.cache/ccache" >> "${GITHUB_PATH}"

      - name: Initialize PBRP source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/recovery"
          cd "${GITHUB_WORKSPACE}/recovery"
          repo init \
            -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git \
            -b pb-12.1 \
            --depth=1
          repo sync -c --force-sync --no-tags --no-clone-bundle \
            -j"$(nproc --all)"

      - name: Fetch Boston device tree
        shell: bash
        env:
          TREE_URL: ${{ inputs.device_tree }}
          TREE_BRANCH: ${{ inputs.device_branch }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/recovery"
          mkdir -p device/motorola
          git clone --depth=1 --branch "${TREE_BRANCH}" \
            "${TREE_URL}" device/motorola/boston
          test -f device/motorola/boston/BoardConfig.mk
          test -f device/motorola/boston/AndroidProducts.mk
          echo "Device tree files:"
          ls -la device/motorola/boston

      - name: Validate PBRP product configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/recovery"
          PRODUCT_FILE="device/motorola/boston/AndroidProducts.mk"
          echo "Checking ${PRODUCT_FILE}"
          cat "${PRODUCT_FILE}"

          if ! grep -Eiq 'pbrp_boston|pb_boston|pitchblack_boston' "${PRODUCT_FILE}"; then
            echo "::error::The Boston tree does not declare a recognizable PBRP product. The supplied tree appears to define TWRP (twrp_boston). Do not rename the product blindly; adapt and validate the tree for PBRP first."
            exit 1
          fi

      - name: Check device dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/recovery"
          if [ -f device/motorola/boston/pbrp.dependencies ]; then
            cat device/motorola/boston/pbrp.dependencies
          elif [ -f device/motorola/boston/omni.dependencies ]; then
            echo "::warning::Found omni.dependencies. Confirm its repositories and branches are compatible with PBRP."
            cat device/motorola/boston/omni.dependencies
          elif [ -f device/motorola/boston/twrp.dependencies ]; then
            echo "::warning::Found twrp.dependencies. Confirm its repositories and branches are compatible with PBRP."
            cat device/motorola/boston/twrp.dependencies
          else
            echo "::warning::No recognized dependency file found. Check for required common, vendor, and kernel trees manually."
          fi

      - name: Build recovery
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/recovery"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 20G

          # Product name must match the product declared by the PBRP device tree.
          if grep -Eiq 'pbrp_boston' device/motorola/boston/AndroidProducts.mk; then
            lunch pbrp_boston-eng
          elif grep -Eiq 'pb_boston' device/motorola/boston/AndroidProducts.mk; then
            lunch pb_boston-eng
          elif grep -Eiq 'pitchblack_boston' device/motorola/boston/AndroidProducts.mk; then
            lunch pitchblack_boston-eng
          else
            echo "::error::No supported PBRP lunch target found."
            exit 1
          fi

          mka adbd "${BUILD_TARGET}"

      - name: Verify and collect output
        id: output
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/recovery"
          OUT_DIR="out/target/product/${DEVICE}"
          mkdir -p "${GITHUB_WORKSPACE}/output"

          case "${BUILD_TARGET}" in
            recoveryimage) expected="recovery.img" ;;
            vendorbootimage) expected="vendor_boot.img" ;;
            bootimage) expected="boot.img" ;;
            *) echo "::error::Unsupported target"; exit 1 ;;
          esac

          if [ ! -s "${OUT_DIR}/${expected}" ]; then
            echo "::error::Expected output ${OUT_DIR}/${expected} was not created."
            find out/target/product -maxdepth 3 -type f -name '*.img' -print || true
            exit 1
          fi

          cp -v "${OUT_DIR}/${expected}" "${GITHUB_WORKSPACE}/output/"
          echo "image=${expected}" >> "${GITHUB_OUTPUT}"
          sha256sum "${GITHUB_WORKSPACE}/output/${expected}" \
            | tee "${GITHUB_WORKSPACE}/output/SHA256SUMS.txt"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-boston-${{ inputs.build_target }}-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Create release
        if: inputs.auto_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pbrp-boston-${{ github.run_number }}
          name: PBRP Boston build ${{ github.run_number }}
          prerelease: true
          files: output/*
          body: |
            Unofficial recovery build for Motorola Moto G Stylus 5G (2024), codename Boston.

            This build is not confirmed safe to flash. Verify device compatibility,
            boot image format, AVB behavior, and partition layout before use.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
